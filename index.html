<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320">
<title>Snake</title>
</head>

<body style="
margin:0;
background:black;
color:white;
width:240px;
height:320px;
font-family:Arial;
overflow:hidden;
">

<div style="text-align:center;padding-top:12px;font-size:20px;font-weight:bold;">
SNAKE
</div>

<div id="score" style="text-align:center;font-size:12px;margin-top:4px;">
SCORE: 0
</div>

<canvas id="game"
width="220"
height="240"
style="display:block;margin:10px auto;border:1px solid white;">
</canvas>

<div id="status" style="text-align:center;font-size:12px;">
PRESS OK TO START
</div>

<script>

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var snake;
var food;
var direction;
var running = false;
var score = 0;
var timer;

function startGame() {

    snake = [
        {x:100,y:100},
        {x:90,y:100},
        {x:80,y:100}
    ];

    food = {
        x:140,
        y:100
    };

    direction = "RIGHT";
    score = 0;
    running = true;

    document.getElementById("score").innerHTML = "SCORE: 0";
    document.getElementById("status").innerHTML = "USE ARROWS";

    clearInterval(timer);
    timer = setInterval(gameLoop, 180);
}

function gameLoop() {

    var head = {
        x:snake[0].x,
        y:snake[0].y
    };

    if (direction == "UP") {
        head.y -= 10;
    }

    if (direction == "DOWN") {
        head.y += 10;
    }

    if (direction == "LEFT") {
        head.x -= 10;
    }

    if (direction == "RIGHT") {
        head.x += 10;
    }

    if (
        head.x < 0 ||
        head.x >= 220 ||
        head.y < 0 ||
        head.y >= 240
    ) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (
        head.x == food.x &&
        head.y == food.y
    ) {

        score++;

        document.getElementById("score").innerHTML =
            "SCORE: " + score;

        food.x = Math.floor(Math.random() * 22) * 10;
        food.y = Math.floor(Math.random() * 24) * 10;

    } else {
        snake.pop();
    }

    draw();
}

function draw() {

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,220,240);

    ctx.fillStyle = "white";

    for (var i = 0; i < snake.length; i++) {
        ctx.fillRect(
            snake[i].x,
            snake[i].y,
            10,
            10
        );
    }

    ctx.fillRect(
        food.x,
        food.y,
        10,
        10
    );
}

function gameOver() {

    running = false;
    clearInterval(timer);

    document.getElementById("status").innerHTML =
        "GAME OVER - PRESS OK";
}

document.addEventListener("keydown", function(e) {

    if (e.key == "Enter") {

        if (!running) {
            startGame();
        }

        return;
    }

    if (!running) {
        return;
    }

    if (e.key == "ArrowUp" && direction != "DOWN") {
        direction = "UP";
    }

    if (e.key == "ArrowDown" && direction != "UP") {
        direction = "DOWN";
    }

    if (e.key == "ArrowLeft" && direction != "RIGHT") {
        direction = "LEFT";
    }

    if (e.key == "ArrowRight" && direction != "LEFT") {
        direction = "RIGHT";
    }

});

draw();

</script>

</body>
</html>
