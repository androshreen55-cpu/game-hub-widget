<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320">
<title>Game Hub</title>
</head>

<body style="
margin:0;
background:black;
color:white;
width:240px;
height:320px;
font-family:Arial;
overflow:hidden;
">

<div id="title" style="
text-align:center;
padding-top:8px;
font-size:20px;
font-weight:bold;
">
SNAKE
</div>

<div id="score" style="
text-align:center;
font-size:11px;
margin-top:2px;
">
SCORE: 0 &nbsp; BEST: 0
</div>

<canvas id="game"
width="220"
height="240"
style="
display:block;
margin:7px auto;
border:1px solid white;
">
</canvas>

<div id="status" style="
text-align:center;
font-size:11px;
">
PRESS OK TO START
</div>

<script>

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var snake = [];
var food = {};
var direction = "RIGHT";
var nextDirection = "RIGHT";

var running = false;
var score = 0;
var best = 0;
var speed = 180;
var timer = null;

var cell = 10;
var width = 22;
var height = 24;


/* START */

function startGame() {

    snake = [
        {x:100,y:100},
        {x:90,y:100},
        {x:80,y:100}
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;
    speed = 180;
    running = true;

    createFood();

    updateScore();

    document.getElementById("status").innerHTML =
        "USE ARROWS   BACK EXIT";

    clearInterval(timer);

    timer = setInterval(gameLoop, speed);

    draw();
}


/* FOOD */

function createFood() {

    var valid = false;

    while (!valid) {

        food.x = Math.floor(Math.random() * width) * cell;
        food.y = Math.floor(Math.random() * height) * cell;

        valid = true;

        for (var i = 0; i < snake.length; i++) {

            if (
                snake[i].x == food.x &&
                snake[i].y == food.y
            ) {
                valid = false;
                break;
            }
        }
    }
}


/* GAME LOOP */

function gameLoop() {

    direction = nextDirection;

    var head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction == "UP") {
        head.y -= cell;
    }

    if (direction == "DOWN") {
        head.y += cell;
    }

    if (direction == "LEFT") {
        head.x -= cell;
    }

    if (direction == "RIGHT") {
        head.x += cell;
    }


    /* WALL */

    if (
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height
    ) {
        gameOver();
        return;
    }


    /* BODY */

    for (var i = 0; i < snake.length; i++) {

        if (
            head.x == snake[i].x &&
            head.y == snake[i].y
        ) {
            gameOver();
            return;
        }
    }


    snake.unshift(head);


    /* EAT */

    if (
        head.x == food.x &&
        head.y == food.y
    ) {

        score++;

        if (score > best) {
            best = score;
        }

        updateScore();

        createFood();

        /* SPEED UP */

        if (speed > 70) {
            speed -= 8;

            clearInterval(timer);
            timer = setInterval(gameLoop, speed);
        }

    } else {

        snake.pop();

    }

    draw();
}


/* DRAW */

function draw() {

    ctx.fillStyle = "black";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle = "#111";

    for (var x = 0; x <= canvas.width; x += cell) {

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();

    }

    for (var y = 0; y <= canvas.height; y += cell) {

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();

    }


    /* SNAKE */

    ctx.fillStyle = "white";

    for (var i = 0; i < snake.length; i++) {

        ctx.fillRect(
            snake[i].x + 1,
            snake[i].y + 1,
            cell - 2,
            cell - 2
        );
    }


    /* HEAD */

    if (snake.length > 0) {

        ctx.fillStyle = "#aaa";

        ctx.fillRect(
            snake[0].x + 1,
            snake[0].y + 1,
            cell - 2,
            cell - 2
        );
    }


    /* FOOD */

    ctx.fillStyle = "white";

    ctx.fillRect(
        food.x + 2,
        food.y + 2,
        cell - 4,
        cell - 4
    );
}


/* SCORE */

function updateScore() {

    document.getElementById("score").innerHTML =
        "SCORE: " + score +
        " &nbsp; BEST: " + best;
}


/* GAME OVER */

function gameOver() {

    running = false;

    clearInterval(timer);

    document.getElementById("status").innerHTML =
        "GAME OVER &nbsp; OK=RESTART";
}


/* KEYBOARD */

document.addEventListener("keydown", function(e) {


    /* OK */

    if (e.key == "Enter") {

        if (!running) {
            startGame();
        }

        return;
    }


    /* UP */

    if (
        e.key == "ArrowUp" &&
        direction != "DOWN"
    ) {
        nextDirection = "UP";
    }


    /* DOWN */

    if (
        e.key == "ArrowDown" &&
        direction != "UP"
    ) {
        nextDirection = "DOWN";
    }


    /* LEFT */

    if (
        e.key == "ArrowLeft" &&
        direction != "RIGHT"
    ) {
        nextDirection = "LEFT";
    }


    /* RIGHT */

    if (
        e.key == "ArrowRight" &&
        direction != "LEFT"
    ) {
        nextDirection = "RIGHT";
    }


    /* BACK */

    if (
        e.key == "Escape" ||
        e.key == "Backspace"
    ) {

        clearInterval(timer);

        running = false;

        document.getElementById("status").innerHTML =
            "EXITED - PRESS OK";

    }

});


/* FIRST SCREEN */

draw();

</script>

</body>
</html>
