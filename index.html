<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320,initial-scale=1">
<title>Game Hub</title>
</head>

<body style="
margin:0;
padding:0;
width:240px;
height:320px;
background:#000;
color:#fff;
font-family:Arial;
overflow:hidden;
">

<div style="
width:240px;
height:320px;
box-sizing:border-box;
padding-top:25px;
">

<div style="text-align:center;font-size:24px;font-weight:bold;">
GAME HUB
</div>

<div id="menu" style="margin:30px 20px 0;font-size:18px;line-height:42px;">
</div>

<div style="
position:absolute;
bottom:8px;
width:240px;
text-align:center;
font-size:11px;
">
↑ ↓ Select &nbsp; OK Enter
</div>

</div>

<script>
var games = ["GAMES", "APPS", "SETTINGS", "ABOUT"];
var selected = 0;

function showMenu() {
    var menu = document.getElementById("menu");
    var html = "";

    for (var i = 0; i < games.length; i++) {
        if (i == selected) {
            html += "<div style='background:white;color:black;padding-left:5px;'>";
            html += "> " + games[i];
            html += "</div>";
        } else {
            html += "<div>> " + games[i] + "</div>";
        }
    }

    menu.innerHTML = html;
}

document.addEventListener("keydown", function(e) {

    if (e.key == "ArrowDown") {
        selected++;

        if (selected >= games.length) {
            selected = 0;
        }

        showMenu();
    }

    if (e.key == "ArrowUp") {
        selected--;

        if (selected < 0) {
            selected = games.length - 1;
        }

        showMenu();
    }

    if (e.key == "Enter") {
        document.getElementById("menu").innerHTML =
            "<div style='text-align:center;margin-top:40px;'>" +
            "<b>" + games[selected] + "</b><br><br>" +
            "Coming Soon..." +
            "</div>";
    }

});

showMenu();
</script>

</body>
</html>
