<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240,height=320">
<title>Button Test</title>
</head>

<body style="margin:0;background:black;color:white;width:240px;height:320px;font-family:Arial;text-align:center;">

<div style="padding-top:30px;font-size:24px;">
BUTTON TEST
</div>

<div id="test" style="margin-top:50px;font-size:20px;">
PRESS ANY KEY
</div>

<script>
document.addEventListener("keydown", function(e) {
    document.getElementById("test").innerHTML = "BUTTON PRESSED";
});
</script>

</body>
</html>
